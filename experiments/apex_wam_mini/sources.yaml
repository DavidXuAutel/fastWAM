# G1 Stage B/C（§10.5）
stage_b_mix:
  target_action_data: 0.25
  compatible_action_data: 0.30
  video_only_or_incompatible: 0.40
  failure: 0.05

stage_c_mix:
  robot_target: 0.90
  failure: 0.10

# Franka Stage B：LIBERO 作 compatible + action，RoboTwin 作 video-only
franka_stage_b_mix:
  target_action_data: 0.15
  compatible_action_data: 0.45
  video_only_or_incompatible: 0.35
  failure: 0.05

franka_stage_c_mix:
  robot_target: 0.85
  failure: 0.15
